# Org-required lint. The mzizi-dev org ruleset names this file in a
# "Require workflows to pass" rule, so GitHub runs it on every pull request
# in every repo in the org — no per-repo .github/workflows/lint.yml needed.
#
# Two jobs, both calling reusable workflows in nyuchi/.github:
#
#   lint       lint / actionlint, lint / markdownlint, lint / yamllint
#   vite-plus  vite-plus / fmt, vite-plus / check, vite-plus / test,
#              vite-plus / build
#
# mzizi-dev is the pilot org for moving from prettier to Vite+ (owner
# approval 2026-10-03). The vite-plus job ran advisory (`enforce: false`)
# until every repo passed it, and is now enforced: a failing vite-plus job
# fails this REQUIRED workflow. The `vite-plus /` contexts are required in
# the org ruleset; `lint / prettier` and `lint / JSON validity` are not, and
# the lint job no longer runs them (`vite-plus / fmt` replaces both). The
# full order is the MIGRATION section of
# nyuchi/.github/.github/workflows/reusable-vite-plus.yml.
#
# A repo's own .prettierrc, .prettierignore, .markdownlint.jsonc,
# .yamllint.yaml and .oxfmtrc.json at its root always win. Where one is
# missing, the reusable workflows fall back to the canonical copy in
# nyuchi/.github.

name: Org lint

on:
  pull_request:
  merge_group:

concurrency:
  group: org-lint-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: nyuchi/.github/.github/workflows/reusable-lint.yml@main
    with:
      prettier: false
      json-validity: false
  vite-plus:
    uses: nyuchi/.github/.github/workflows/reusable-vite-plus.yml@main
